name: flutter_trading_view
description: A realtime stock market chart application built with clean architecture, Riverpod, and go_router.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.13.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  flutter_riverpod: ^2.4.0
  go_router: ^17.2.3
  dio: ^5.3.2
  web_socket_channel: ^2.3.0
  json_annotation: ^4.9.0
  freezed_annotation: ^2.2.0
  flutter_svg: ^2.1.1
  intl: ^0.18.1
  equatable: ^2.0.5
  flutter_dotenv: ^5.0.2
  webview_flutter: ^4.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.0
  freezed: ^2.2.0
  json_serializable: ^6.6.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/json/
    - assets/tradingview/chart.html